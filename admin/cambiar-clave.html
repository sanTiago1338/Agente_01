<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Nueva contraseña · Tiago Store</title>

  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../favicon.png" sizes="32x32">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">

<!--
  ============================================================
  TIAGO STORE · Poner una contraseña nueva
  ============================================================
  Esta página NO existía con Firebase, y hace falta con Supabase.

  Firebase alojaba él mismo la pantalla de "elegí tu contraseña nueva":
  el link del correo llevaba a un dominio de Google, el usuario escribía
  la contraseña ahí y volvía. Cómodo, pero la pantalla era de ellos.

  Supabase no aloja nada de eso. Su link de recuperación vuelve a TU sitio
  con un token en el # de la URL, abre la sesión y te deja a vos la
  pantalla. Esta es esa pantalla.

  A dónde vuelve el link se define en dos lugares y tienen que coincidir:
    · js/supabase-auth.js -> redirectTo (ya apunta a este archivo)
    · Supabase → Authentication → URL Configuration → Redirect URLs
      (agregá la URL de esta página; si no está en la lista, Supabase
       ignora el redirectTo y el correo lleva a cualquier lado)
  ============================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  /* Misma paleta y mismas cajas que admin/login.html, para que se sienta
     la misma pantalla y no una página perdida. */
  :root {
    --fondo:       #ffffff;
    --superficie:  #fbfbfc;
    --superficie-2:#f4f5f7;
    --separador:   rgba(20,22,26,.09);
    --tinta:       #14161a;
    --tinta-media: #3d424b;
    --tinta-suave: #767c88;
    --tinta-tenue: #9aa0ab;
    --marca:       #e50914;
    --oro:         #9a7400;
    --sombra-alta: 0 2px 6px rgba(20,22,26,.07), 0 12px 32px rgba(20,22,26,.10);

    --negro:    var(--fondo);
    --panel:    var(--superficie);
    --panel-2:  var(--superficie-2);
    --borde:    var(--separador);
    --rojo:     var(--marca);
    --dorado:   var(--oro);
    --texto:    var(--tinta-media);
    --gris:     var(--tinta-suave);
    --gris-dim: var(--tinta-tenue);
    --ok:       #15803d;
    --error:    #dc2626;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--negro);
    color: var(--texto);
    font-family: 'Outfit', system-ui, -apple-system, sans-serif;
    display: grid;
    place-items: center;
    padding: 24px 18px;
    background-image:
      radial-gradient(900px 420px at 50% -120px, rgba(229,9,20,.06),  transparent 65%),
      radial-gradient(600px 300px at 85% 110%, rgba(245,197,24,.08), transparent 60%);
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--borde);
    border-radius: 16px;
    padding: 34px 30px 28px;
    box-shadow: var(--sombra-alta);
  }

  .logo {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 34px;
    letter-spacing: .06em;
    text-align: center;
    margin: 0 0 2px;
    line-height: 1;
  }
  .logo .zona { color: var(--rojo); }
  .logo .vip  { color: var(--tinta); }

  .subtitulo {
    text-align: center;
    font-size: 11.5px;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: var(--gris-dim);
    margin: 0 0 30px;
  }

  .campo { margin-bottom: 16px; }

  label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--gris);
    margin-bottom: 7px;
    letter-spacing: .02em;
  }

  .input-wrap { position: relative; }

  input[type=password],
  input[type=text] {
    width: 100%;
    padding: 12px 14px;
    padding-right: 46px;
    background: var(--panel-2);
    border: 1px solid var(--borde);
    border-radius: 9px;
    color: var(--texto);
    font-size: 15px;
    font-family: inherit;
    transition: border-color .15s;
  }
  input::placeholder { color: var(--gris-dim); }
  input:focus {
    outline: none;
    border-color: var(--rojo);
    box-shadow: 0 0 0 3px rgba(229,9,20,.14);
  }
  input:disabled { opacity: .55; }

  .ojo {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--gris-dim);
    cursor: pointer;
    font-size: 16px;
    padding: 8px 10px;
    line-height: 1;
    border-radius: 6px;
  }
  .ojo:hover { color: var(--tinta); }
  .ojo:focus-visible { outline: 2px solid var(--rojo); outline-offset: -2px; }

  /* Barra de fuerza de la contraseña */
  .fuerza { margin: -6px 0 18px; }
  .fuerza-barra {
    height: 4px;
    background: var(--panel-2);
    border-radius: 99px;
    overflow: hidden;
  }
  .fuerza-relleno {
    height: 100%;
    width: 0;
    border-radius: 99px;
    transition: width .2s, background-color .2s;
  }
  .fuerza-texto {
    font-size: 12px;
    color: var(--gris-dim);
    margin-top: 6px;
    min-height: 16px;
  }

  .btn-entrar {
    width: 100%;
    padding: 13px;
    background: var(--rojo);
    color: #fff;
    border: none;
    border-radius: 9px;
    font-size: 15.5px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: .02em;
    transition: filter .15s;
  }
  .btn-entrar:hover:not(:disabled) { filter: brightness(.95); }
  .btn-entrar:disabled { opacity: .5; cursor: not-allowed; }

  .mensaje {
    margin-top: 18px;
    padding: 12px 14px;
    border-radius: 9px;
    font-size: 13.5px;
    line-height: 1.5;
    display: none;
  }
  .mensaje.visible { display: block; }
  .mensaje.error {
    background: rgba(220,38,38,.08);
    border: 1px solid rgba(220,38,38,.3);
    color: #8f1616;
  }
  .mensaje.ok {
    background: rgba(21,128,61,.08);
    border: 1px solid rgba(21,128,61,.3);
    color: #10502a;
  }

  .pie {
    margin-top: 26px;
    padding-top: 18px;
    border-top: 1px solid var(--borde);
    text-align: center;
  }
  .pie a {
    color: var(--gris-dim);
    font-size: 13px;
    text-decoration: none;
  }
  .pie a:hover { color: var(--texto); }

  #verificando {
    position: fixed;
    inset: 0;
    background: var(--negro);
    display: grid;
    place-items: center;
    z-index: 50;
  }
  .spinner {
    width: 34px; height: 34px;
    border: 3px solid var(--borde);
    border-top-color: var(--rojo);
    border-radius: 50%;
    animation: girar .7s linear infinite;
  }
  @keyframes girar { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 2.5s; }
  }

  .oculto { display: none !important; }
</style>
</head>
<body>

<!-- Tapa la página mientras se lee el token que vino en el link del correo -->
<div id="verificando"><div class="spinner" role="status" aria-label="Verificando el link"></div></div>

<main class="card" id="tarjeta" hidden>
  <h1 class="logo"><span class="zona">TIAGO</span> <span class="vip">STORE</span></h1>
  <p class="subtitulo">Nueva contraseña</p>

  <!-- Caso normal: el link es válido -->
  <form id="formClave" class="oculto" novalidate>
    <p style="font-size:13.5px;line-height:1.55;margin:0 0 20px;color:var(--gris);">
      Escribí la contraseña nueva para <strong id="elEmail" style="color:var(--tinta);"></strong>.
    </p>

    <div class="campo">
      <label for="clave1">Contraseña nueva</label>
      <div class="input-wrap">
        <input type="password" id="clave1" autocomplete="new-password"
               placeholder="Al menos 8 caracteres" required>
        <button type="button" class="ojo" id="btnOjo"
                aria-label="Mostrar contraseña">👁</button>
      </div>
    </div>

    <div class="fuerza">
      <div class="fuerza-barra"><div class="fuerza-relleno" id="fuerzaRelleno"></div></div>
      <div class="fuerza-texto" id="fuerzaTexto"></div>
    </div>

    <div class="campo">
      <label for="clave2">Repetila</label>
      <div class="input-wrap">
        <input type="password" id="clave2" autocomplete="new-password"
               placeholder="La misma de arriba" required>
      </div>
    </div>

    <button type="submit" class="btn-entrar" id="btnGuardar">Guardar contraseña</button>
  </form>

  <!-- Caso feo: el link venció, ya se usó, o se entró a esta página de gedo -->
  <div id="sinToken" class="oculto">
    <div class="mensaje error visible">
      Este link no sirve para cambiar la contraseña. Los links del correo
      duran una hora y se pueden usar una sola vez.
    </div>
    <p style="font-size:13.5px;line-height:1.55;color:var(--gris);">
      Volvé al panel y tocá <strong>“¿Olvidaste tu contraseña?”</strong> para
      que te llegue uno nuevo.
    </p>
    <a href="login.html" class="btn-entrar"
       style="display:block;text-align:center;text-decoration:none;margin-top:18px;">
      Ir al panel
    </a>
  </div>

  <div id="mensaje" class="mensaje" role="status" aria-live="polite"></div>

  <div class="pie">
    <a href="../index.html">← Volver a la tienda</a>
  </div>
</main>

<script type="module">
// Esta página es propia de Supabase: con Firebase no existía, así que le
// habla al cliente directamente en vez de pasar por js/panel-auth.js.
import { sbAdmin } from '../js/supabase-config.js';

const $ = id => document.getElementById(id);
const LARGO_MINIMO = 8;   // el mínimo de Supabase son 6; pedimos un poco más

function mostrar(texto, tipo = 'error') {
  const m = $('mensaje');
  m.textContent = texto;
  m.className = `mensaje visible ${tipo}`;
}

// -----------------------------------------------------------
// 1. ¿Vino con un link válido?
// -----------------------------------------------------------
// El link del correo trae el token en el # de la URL. Como el cliente se
// creó con detectSessionInUrl: true, supabase-js ya lo leyó y abrió la
// sesión antes de que corra esta línea. Si hay sesión, el link servía.
//
// El evento PASSWORD_RECOVERY es la señal explícita de que la sesión viene
// de un correo de recuperación (y no de un login normal en otra pestaña).
let listo = false;

function habilitar(email) {
  if (listo) return;
  listo = true;

  // El token ya está leído y guardado en la sesión. Sacarlo de la barra de
  // direcciones evita que quede en el historial o que el usuario comparta
  // por error una URL con un token adentro.
  history.replaceState(null, '', location.pathname + location.search);

  $('verificando').remove();
  $('tarjeta').hidden = false;
  $('elEmail').textContent = email || 'tu cuenta';
  $('formClave').classList.remove('oculto');
  $('clave1').focus();
}

function rechazar() {
  if (listo) return;
  listo = true;
  $('verificando').remove();
  $('tarjeta').hidden = false;
  $('sinToken').classList.remove('oculto');
}

sbAdmin.auth.onAuthStateChange((evento, sesion) => {
  if (evento === 'PASSWORD_RECOVERY' && sesion) habilitar(sesion.user.email);
});

// Red de seguridad: si el evento no llega (porque la sesión ya estaba
// abierta antes de entrar acá, por ejemplo), preguntamos a mano.
// El medio segundo es para no ganarle de mano al evento de arriba.
setTimeout(async () => {
  const { data } = await sbAdmin.auth.getSession();
  if (data.session) habilitar(data.session.user.email);
  else              rechazar();
}, 500);


// -----------------------------------------------------------
// 2. Mostrar / ocultar
// -----------------------------------------------------------
$('btnOjo').addEventListener('click', () => {
  const campo  = $('clave1');
  const oculta = campo.type === 'password';
  campo.type = oculta ? 'text' : 'password';
  $('btnOjo').textContent = oculta ? '🙈' : '👁';
  $('btnOjo').setAttribute('aria-label', oculta ? 'Ocultar contraseña' : 'Mostrar contraseña');
  campo.focus();
});


// -----------------------------------------------------------
// 3. Qué tan buena es la contraseña
// -----------------------------------------------------------
// No bloquea nada: es para que se vea de un vistazo si conviene alargarla.
// Cuenta variedad (minúsculas, mayúsculas, números, símbolos) y largo,
// que es lo que de verdad hace difícil una contraseña.
const NIVELES = [
  { texto: '',                    color: 'transparent', ancho: '0%'   },
  { texto: 'Muy débil',           color: '#dc2626',     ancho: '25%'  },
  { texto: 'Débil',               color: '#ea580c',     ancho: '50%'  },
  { texto: 'Buena',               color: '#ca8a04',     ancho: '75%'  },
  { texto: 'Muy buena',           color: '#15803d',     ancho: '100%' }
];

$('clave1').addEventListener('input', e => {
  const clave = e.target.value;
  let nivel = 0;

  if (clave.length > 0) {
    let puntos = 0;
    if (/[a-z]/.test(clave))       puntos++;
    if (/[A-Z]/.test(clave))       puntos++;
    if (/[0-9]/.test(clave))       puntos++;
    if (/[^a-zA-Z0-9]/.test(clave)) puntos++;
    if (clave.length >= 12)        puntos++;

    if      (clave.length < LARGO_MINIMO) nivel = 1;
    else if (puntos <= 1)                 nivel = 1;
    else if (puntos === 2)                nivel = 2;
    else if (puntos === 3)                nivel = 3;
    else                                  nivel = 4;
  }

  const n = NIVELES[nivel];
  $('fuerzaRelleno').style.width           = n.ancho;
  $('fuerzaRelleno').style.backgroundColor = n.color;
  $('fuerzaTexto').textContent =
    clave.length > 0 && clave.length < LARGO_MINIMO
      ? `Le faltan ${LARGO_MINIMO - clave.length} caracteres`
      : n.texto;
});


// -----------------------------------------------------------
// 4. Guardar
// -----------------------------------------------------------
$('formClave').addEventListener('submit', async e => {
  e.preventDefault();
  $('mensaje').className = 'mensaje';

  const clave1 = $('clave1').value;
  const clave2 = $('clave2').value;

  if (clave1.length < LARGO_MINIMO) {
    mostrar(`La contraseña tiene que tener al menos ${LARGO_MINIMO} caracteres.`);
    $('clave1').focus();
    return;
  }
  if (clave1 !== clave2) {
    mostrar('Las dos contraseñas no son iguales.');
    $('clave2').select();
    return;
  }

  const btn = $('btnGuardar');
  btn.disabled = true;
  btn.textContent = 'Guardando…';

  const { error } = await sbAdmin.auth.updateUser({ password: clave1 });

  if (error) {
    const texto = (error.message || '').toLowerCase();
    mostrar(
      texto.includes('should be different')
        ? 'Esa es la contraseña que ya tenías. Poné una distinta.'
        : texto.includes('expired') || texto.includes('invalid')
          ? 'El link venció. Pedí uno nuevo desde el panel.'
          : `No se pudo guardar: ${error.message}`
    );
    btn.disabled = false;
    btn.textContent = 'Guardar contraseña';
    return;
  }

  mostrar('Listo. Tu contraseña quedó cambiada. Te llevamos al panel…', 'ok');
  $('formClave').classList.add('oculto');
  // La sesión ya quedó abierta con la contraseña nueva, así que va derecho
  // al panel sin pedirla otra vez.
  setTimeout(() => location.replace('index.html'), 1600);
});
</script>

<!-- Fondo de burbujas de vidrio, el mismo de la tienda -->
<script src="../bg-burbujas.js" defer></script>
</body>
</html>
