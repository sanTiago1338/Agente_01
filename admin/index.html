<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Panel Tiago Store</title>

  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../favicon.png" sizes="32x32">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  /* La misma paleta clara de la tienda: blanco, grises fríos y el rojo de
     marca. Los nombres viejos del panel oscuro (--negro, --panel, --texto…)
     quedan abajo como alias, así las 900 líneas de CSS que ya los usan
     siguen funcionando sin tocarlas. Igual que se hizo en index.html. */
  :root {
    /* Superficies */
    --fondo:        #ffffff;   /* fondo de la página */
    --superficie:   #fbfbfc;   /* tarjetas y paneles */
    --superficie-2: #f4f5f7;   /* zonas elevadas: inputs, filas */
    --superficie-3: #eceef1;   /* botones de icono, etiquetas */
    --separador:    rgba(20,22,26,.09);
    --separador-2:  #dfe0e5;

    /* Texto */
    --tinta:       #14161a;   /* títulos y datos fuertes */
    --tinta-media: #3d424b;   /* cuerpo */
    --tinta-suave: #767c88;   /* secundario */
    --tinta-tenue: #9aa0ab;   /* pistas y placeholders */

    /* Marca */
    --marca:        #e50914;
    --marca-oscura: #b8070f;
    --oro:          #9a7400;   /* oro legible sobre blanco */

    /* Estados — oscurecidos para que se lean sobre blanco */
    --ok:       #15803d;
    --warn:     #a16207;
    --error:    #dc2626;
    --info:     #1d4ed8;

    --sombra:      0 1px 2px rgba(20,22,26,.05), 0 4px 14px rgba(20,22,26,.06);
    --sombra-alta: 0 2px 6px rgba(20,22,26,.07), 0 12px 32px rgba(20,22,26,.10);

    /* Alias históricos (venían del panel oscuro) */
    --negro:    var(--fondo);
    --panel:    var(--superficie);
    --panel-2:  var(--superficie-2);
    --panel-3:  var(--superficie-3);
    --borde:    var(--separador);
    --borde-2:  var(--separador-2);
    --rojo:     var(--marca);
    --rojo2:    var(--marca-oscura);
    --dorado:   var(--oro);
    --texto:    var(--tinta-media);
    --gris:     var(--tinta-suave);
    --gris-dim: var(--tinta-tenue);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--fondo);
    color: var(--texto);
    font-family: 'Outfit', system-ui, -apple-system, sans-serif;
    font-size: 15px;
  }

  /* ===== BURBUJAS DECORATIVAS =====
     El mismo fondo de la tienda. Círculos difusos detrás del contenido,
     puramente visuales: no interceptan clicks y se apagan en pantallas
     chicas. Las burbujas animadas las agrega bg-burbujas.js al final. */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(circle 220px at 12% 14%, rgba(229,9,20,.05),   transparent 70%),
      radial-gradient(circle 170px at 88% 22%, rgba(245,197,24,.07), transparent 70%),
      radial-gradient(circle 130px at 78% 68%, rgba(229,9,20,.035),  transparent 70%),
      radial-gradient(circle 190px at 8%  76%, rgba(245,197,24,.05), transparent 70%);
  }
  @media (max-width: 600px) { body::before { display: none; } }

  /* ================= PANTALLA DE CARGA ================= */
  #verificando {
    position: fixed;
    inset: 0;
    background: var(--negro);
    display: grid;
    place-items: center;
    z-index: 100;
    gap: 14px;
    align-content: center;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--borde);
    border-top-color: var(--rojo);
    border-radius: 50%;
    animation: girar .7s linear infinite;
  }
  @keyframes girar { to { transform: rotate(360deg); } }
  #verificando p { color: var(--gris-dim); font-size: 13px; margin: 0; }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.5s; } }

  /* ================= ESTRUCTURA =================
     Compu (900 px o más): menú fijo a la izquierda y el contenido al lado.
     Celular: barra arriba con la marca, y abajo una barra con las vistas,
     al alcance del pulgar.

     Cada vista tiene su botón [data-vista] en los DOS menús; el script de
     abajo los marca a la par, así da igual cuál se toque. */
  .lateral { display: none; }
  .contenido { min-width: 0; padding-bottom: 78px; }   /* aire para la barra de abajo */

  /* Íconos dibujados (trazos, no emojis): heredan el color del texto */
  .ico {
    width: 20px; height: 20px; flex: none;
    fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }

  /* ---- Barra de arriba ---- */
  .barra {
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 56px;
    padding: 9px 12px;
    background: rgba(255,255,255,.88);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--borde);
  }
  .barra-marca {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 23px;
    letter-spacing: .05em;
    line-height: 1;
    color: var(--tinta);
    text-decoration: none;
  }
  .barra-marca .zona { color: var(--rojo); }
  .barra-titulo { display: none; min-width: 0; }
  .barra-titulo h2 {
    margin: 0;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -.01em;
    color: var(--tinta);
  }
  .barra-titulo p { margin: 2px 0 0; font-size: 13px; color: var(--tinta-suave); }
  .barra-acciones { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .barra-fecha { display: none; font-size: 13px; color: var(--tinta-suave); }
  .barra-fecha::first-letter { text-transform: uppercase; }

  .icono-btn {
    width: 38px; height: 38px;
    display: inline-grid; place-items: center;
    border: 1px solid var(--borde-2);
    border-radius: 10px;
    background: #fff;
    color: var(--tinta-media);
    cursor: pointer;
    text-decoration: none;
  }
  .icono-btn:hover { color: var(--tinta); background: var(--superficie-2); }

  /* ---- Barra de abajo (celular) ---- */
  .menu-movil {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 40;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    padding: 4px 4px calc(4px + env(safe-area-inset-bottom));
    background: rgba(255,255,255,.96);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--borde);
  }
  .menu-movil .vista-tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 7px 2px;
    border: none;
    border-radius: 10px;
    background: none;
    font: 600 11px 'Outfit', sans-serif;
    color: var(--tinta-suave);
    cursor: pointer;
  }
  .menu-movil .vista-tab.activa { color: var(--rojo); }
  .menu-movil .vista-tab.activa .ico { stroke-width: 2.4; }

  /* ---- Contadores rojos del menú ----
     Ventas: pedidos por atender. Stock: productos a los que se les acaba.
     Los pone window.ponerContador(); en 0 se esconden. */
  .contador {
    min-width: 20px; height: 20px;
    padding: 0 6px;
    border-radius: 99px;
    background: var(--error);
    color: #fff;
    font: 800 11px/20px 'Outfit', sans-serif;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .contador[hidden] { display: none; }
  .lateral .contador { margin-left: auto; }
  .menu-movil .vista-tab { position: relative; }
  .menu-movil .contador {
    position: absolute;
    top: 1px; left: calc(50% + 5px);
    min-width: 18px; height: 18px;
    padding: 0 5px;
    font-size: 10px; line-height: 18px;
    box-shadow: 0 0 0 2px #fff;
  }

  /* ---- Menú lateral (compu) ---- */
  @media (min-width: 900px) {
    #app:not([hidden]) {
      display: grid;
      grid-template-columns: 236px minmax(0, 1fr);
      min-height: 100vh;
    }
    .contenido { padding-bottom: 0; }
    .menu-movil { display: none; }
    .lateral {
      display: flex;
      flex-direction: column;
      gap: 2px;
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 18px 12px 14px;
      background: var(--superficie);
      border-right: 1px solid var(--borde);
    }
    .barra { min-height: 70px; padding: 14px 24px; }
    .barra-marca, .barra-acciones .icono-btn { display: none; }
    .barra-titulo, .barra-fecha { display: block; }
  }

  .marca {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 8px 20px;
    text-decoration: none;
  }
  .marca-ico {
    width: 38px; height: 38px;
    display: grid; place-items: center;
    border-radius: 11px;
    background: linear-gradient(135deg, var(--marca), var(--marca-oscura));
    color: #fff;
    font: 400 24px/1 'Bebas Neue', Impact, sans-serif;
    box-shadow: 0 4px 12px rgba(229,9,20,.28);
  }
  .marca-txt b {
    display: block;
    font: 400 23px/1 'Bebas Neue', Impact, sans-serif;
    letter-spacing: .05em;
    color: var(--tinta);
  }
  .marca-txt b .zona { color: var(--rojo); }
  .marca-txt small {
    display: block;
    margin-top: 3px;
    font-size: 10px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--tinta-tenue);
  }
  .menu-titulo {
    padding: 8px 12px 6px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--tinta-tenue);
  }
  .lateral .vista-tab, .menu-link {
    display: flex;
    align-items: center;
    gap: 11px;
    width: 100%;
    padding: 10px 12px;
    border: none;
    border-radius: 10px;
    background: none;
    font: 600 14px 'Outfit', sans-serif;
    color: var(--tinta-media);
    text-align: left;
    text-decoration: none;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .lateral .vista-tab:hover, .menu-link:hover { background: var(--superficie-3); color: var(--tinta); }
  .lateral .vista-tab.activa { background: #fff; color: var(--rojo); box-shadow: var(--sombra); }

  .lateral-pie {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-top: 12px;
    border-top: 1px solid var(--borde);
  }
  .cuenta { display: flex; align-items: center; gap: 10px; padding: 4px 4px 0 8px; }
  .avatar {
    width: 34px; height: 34px; flex: none;
    display: grid; place-items: center;
    border-radius: 50%;
    background: var(--superficie-3);
    color: var(--tinta);
    font-weight: 800;
    text-transform: uppercase;
  }
  .usuario {
    flex: 1;
    min-width: 0;
    font-size: 12.5px;
    color: var(--tinta-suave);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cuenta .icono-btn { width: 34px; height: 34px; }

  /* ================= BOTONES ================= */
  .btn {
    padding: 9px 15px;
    border-radius: 8px;
    border: 1px solid transparent;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: filter .15s, background .15s;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover:not(:disabled) { filter: brightness(.95); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-rojo   { background: var(--rojo); color: #fff; }
  .btn-fantasma { background: transparent; color: var(--gris); border-color: var(--borde-2); }
  .btn-fantasma:hover:not(:disabled) { color: var(--texto); background: var(--panel-2); }
  .btn-icono {
    padding: 6px 9px;
    background: var(--panel-3);
    border: 1px solid var(--borde-2);
    border-radius: 7px;
    color: var(--gris);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    font-family: inherit;
  }
  .btn-icono:hover { color: var(--tinta); background: #e2e5ea; }
  .btn-icono.peligro:hover { color: #fff; background: var(--error); border-color: var(--error); }

  /* ================= ANCHO DE LAS VISTAS =================
     Todas usan el ancho entero del área de contenido. Juegos, Ventas y
     Stock traen su propio contenedor con tope (1180-1280 px) desde su
     módulo; con #app adelante esta regla les gana sin tocar esos archivos. */
  #app main, #app .ini-wrap, #app .vt-wrap, #app .st-wrap, #app .jg-wrap {
    max-width: none;
    margin: 0;
    padding: 22px 24px 40px;
  }
  @media (max-width: 899px) {
    #app main, #app .ini-wrap, #app .vt-wrap, #app .st-wrap, #app .jg-wrap {
      padding: 14px 10px 24px;
    }
  }

  /* ================= TARJETAS DE RESUMEN ================= */
  /* Tarjetas sueltas, iguales a las del Inicio: blancas, con borde fino
     y una sombra apenas. Las usan las cuatro vistas. */
  .resumen {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 22px;
  }
  .metrica {
    background: #fff;
    border: 1px solid var(--borde);
    border-radius: 14px;
    box-shadow: var(--sombra);
    padding: 15px 16px;
  }
  .metrica-n {
    font-size: 27px;
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .metrica-n.ok     { color: var(--ok); }
  .metrica-n.warn   { color: var(--warn); }
  .metrica-n.dorado { color: var(--dorado); }
  .metrica-n.rojo   { color: var(--rojo); }
  .metrica-n.info   { color: var(--info); }
  .metrica-l {
    font-size: 11.5px;
    color: var(--gris-dim);
    margin-top: 5px;
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  /* ================= BARRA DE HERRAMIENTAS ================= */
  .herramientas {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
    flex-wrap: wrap;
    align-items: center;
  }
  .buscador {
    position: relative;
    flex: 1 1 260px;
    min-width: 200px;
  }
  .buscador input {
    width: 100%;
    padding: 10px 36px 10px 36px;
    background: var(--panel-2);
    border: 1px solid var(--borde);
    border-radius: 9px;
    color: var(--texto);
    font-size: 14.5px;
    font-family: inherit;
  }
  .buscador input:focus {
    outline: none;
    border-color: var(--rojo);
    box-shadow: 0 0 0 3px rgba(229,9,20,.13);
  }
  .buscador input::placeholder { color: var(--gris-dim); }
  .buscador .lupa {
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    color: var(--gris-dim);
    pointer-events: none;
    font-size: 14px;
  }
  .buscador .limpiar {
    position: absolute;
    right: 8px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none;
    color: var(--gris-dim);
    cursor: pointer;
    font-size: 16px;
    padding: 4px 6px;
    line-height: 1;
    display: none;
  }
  .buscador .limpiar:hover { color: var(--texto); }
  .buscador.con-texto .limpiar { display: block; }
  /* type="search" trae su propia ✕ en Chrome y Edge, que salía al lado de
     la nuestra: dos X seguidas. Se apaga solo donde está la nuestra; en
     Juegos y Stock no hay otra y la del navegador es la única que tienen. */
  .buscador:has(.limpiar) input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }

  select {
    padding: 10px 12px;
    background: var(--panel-2);
    border: 1px solid var(--borde);
    border-radius: 9px;
    color: var(--texto);
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    min-width: 145px;
  }
  select:focus { outline: none; border-color: var(--rojo); }

  /* ================= TABLA ================= */
  .tabla-caja {
    background: #fff;
    border: 1px solid var(--borde);
    border-radius: 14px;
    box-shadow: var(--sombra);
    overflow: hidden;
  }
  .tabla-scroll { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  thead th {
    background: var(--panel-2);
    padding: 11px 14px;
    text-align: left;
    font-size: 11px;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--gris-dim);
    font-weight: 700;
    border-bottom: 1px solid var(--borde);
    white-space: nowrap;
  }
  tbody td {
    padding: 11px 14px;
    border-bottom: 1px solid var(--borde);
    vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--superficie-2); }
  tbody tr.inactivo .celda-nombre,
  tbody tr.inactivo .celda-precio { opacity: .48; }

  /* ---- Interruptores de la fila: un toque y se guarda ----
     El color del riel dice qué es (verde disponible, rojo oferta, dorado
     destacado, azul planes) y el texto al lado lo dice con palabras. */
  .interruptores {
    display: grid;
    grid-template-columns: repeat(2, max-content);
    gap: 7px 16px;
  }
  .sw {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 2px 0;
    border: none;
    background: none;
    font: 600 12.5px 'Outfit', sans-serif;
    color: var(--tinta-suave);
    cursor: pointer;
    white-space: nowrap;
  }
  .sw-riel {
    position: relative;
    flex: none;
    width: 32px; height: 18px;
    border-radius: 99px;
    background: var(--separador-2);
    transition: background .15s;
  }
  .sw-bola {
    position: absolute;
    top: 2px; left: 2px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 2px rgba(20,22,26,.3);
    transition: transform .15s;
  }
  .sw[aria-checked="true"] { color: var(--tinta); }
  .sw[aria-checked="true"] .sw-bola { transform: translateX(14px); }
  .sw[aria-checked="true"] .sw-riel                      { background: var(--ok); }
  .sw[aria-checked="true"][data-accion="oferta"] .sw-riel    { background: var(--rojo); }
  .sw[aria-checked="true"][data-accion="destacado"] .sw-riel { background: #b58900; }
  .sw[aria-checked="true"][data-accion="planes"] .sw-riel    { background: var(--info); }
  .sw:hover .sw-riel { filter: brightness(.94); }
  .sw:disabled { opacity: .55; cursor: wait; }
  .sw:focus-visible { outline: 2px solid var(--info); outline-offset: 3px; border-radius: 6px; }
  @media (prefers-reduced-motion: reduce) { .sw-riel, .sw-bola { transition: none; } }

  .precio-btn .ico.precio-lapiz { width: 13px; height: 13px; vertical-align: -2px; }

  /* ---- Precio editable en la misma fila ---- */
  .precio-edicion { display: grid; gap: 6px; min-width: 120px; }
  .precio-edicion label {
    display: grid;
    grid-template-columns: 46px 1fr;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--tinta-suave);
  }
  .precio-edicion input {
    width: 100%;
    min-width: 0;
    padding: 6px 8px;
    border: 1.5px solid var(--borde-2);
    border-radius: 8px;
    font: 700 14px 'Outfit', sans-serif;
    color: var(--tinta);
    background: #fff;
  }
  .precio-edicion input:focus { outline: none; border-color: var(--info); box-shadow: 0 0 0 3px rgba(29,78,216,.12); }
  .precio-edicion input.malo { border-color: var(--error); box-shadow: 0 0 0 3px rgba(220,38,38,.12); }
  .pe-botones { display: flex; gap: 6px; }
  .pe-botones button {
    flex: 1;
    padding: 6px 0;
    border-radius: 8px;
    border: 1px solid var(--borde-2);
    background: #fff;
    font: 700 13px 'Outfit', sans-serif;
    color: var(--tinta-media);
    cursor: pointer;
  }
  .pe-botones .pe-ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  .pe-botones button:disabled { opacity: .6; cursor: wait; }
  .pe-ayuda { font-size: 11px; color: var(--tinta-tenue); }
  .pe-ayuda.error { color: var(--error); font-weight: 600; }

  /* ---- Editar y borrar ---- */
  .accion-btn {
    width: 34px; height: 34px;
    display: inline-grid; place-items: center;
    border: 1px solid var(--borde-2);
    border-radius: 9px;
    background: #fff;
    color: var(--tinta-media);
    cursor: pointer;
    font: 600 13px 'Outfit', sans-serif;
  }
  .accion-btn .ico { width: 17px; height: 17px; }
  .accion-btn .accion-txt { display: none; }
  .accion-btn:hover { color: var(--tinta); background: var(--superficie-2); }
  .accion-btn.peligro:hover { color: #fff; background: var(--error); border-color: var(--error); }

  .paginacion {

    background-size: 200% 100%;
    animation: brillo 1.4s ease-in-out infinite;
    border-radius: 5px;
    height: 14px;
  }
  @keyframes brillo { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .esq { animation: none; } }

  /* ================= AVISOS (toast) ================= */
  #avisos {
    position: fixed;
    bottom: 20px; right: 20px;
    z-index: 90;

    flex-direction: column;
    gap: 9px;
    max-width: min(340px, calc(100vw - 40px));

  .aviso {
    padding: 12px 15px;
    border-radius: 9px;
    font-size: 13.5px;

  .aviso.error { border-color: rgba(220,38,38,.35);  background: #fdecec; color: #8f1616; }
  @keyframes entrar { from { opacity: 0; transform: translateY(10px); } }

  .oculto { display: none !important; }

  /* ================= CELULAR: tabla -> tarjetas ================= */
  @media (max-width: 820px) {
    /* Las cuatro vistas usan esta misma tira de números, pero Productos
       tiene seis y las otras tres tienen cuatro. Con un número fijo de
       columnas alguna quedaba con un hueco al costado: cuatro en tres
       columnas son 3 + 1.

       Así, los cuatro van de a dos y los seis de a tres, y ninguna fila
       queda coja. Si el navegador no entiende :has(), quedan todas de a
       dos, que es correcto igual. */
    .resumen { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .resumen:has(> .metrica:nth-child(5)) { grid-template-columns: repeat(3, 1fr); }
    .metrica { padding: 11px 10px; }
    .metrica-n { font-size: 21px; }
    .metrica-l { font-size: 10px; margin-top: 3px; letter-spacing: 0; }

       cada uno medía distinto (173, 216, 171) y quedaban desparejos. */
    .herramientas { gap: 8px; }
    .buscador { flex: 1 1 100%; }
    .herramientas select { flex: 1 1 calc(50% - 4px); min-width: 0; }
    .herramientas #btnNuevo { flex: 1 1 100%; justify-content: center; padding: 11px; }

    /* En modo tarjeta la tabla ya no necesita desplazarse de costado, pero
       el contenedor seguía en overflow-x:auto y dibujaba una barra gris
       debajo de las tarjetas que no llevaba a ningún lado. */
    .tabla-scroll { overflow-x: visible; }

    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tbody tr {
      background: #fff;
      box-shadow: var(--sombra);
      border: 1px solid var(--borde);
      border-radius: 14px;
      margin-bottom: 10px;
      padding: 13px;
      position: relative;
    }
    tbody tr:hover td { background: transparent; }
    tbody td {
      border: none;
      padding: 3px 0;
    }
    .celda-img {
      position: absolute;
      top: 13px; left: 13px;
    }
    .celda-nombre {
      padding-left: 54px !important;
      min-height: 46px;
      min-width: 0;
    }
    .celda-precio { padding-left: 54px !important; font-size: 17px; }
    .celda-cat, .celda-estado { padding-top: 8px !important; }
    .celda-acciones {

      padding-top: 11px !important;
      border-top: 1px solid var(--borde);
      margin-top: 9px;
    }
    .celda-acciones .btn-icono { padding: 8px 13px; }
    /* En la tarjeta del celular sobra ancho: los botones dicen qué hacen */
    .accion-btn {
      width: auto; height: 36px;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 0 14px;
    }
    .accion-btn .accion-txt { display: inline; }
    /* Los cuatro interruptores de a dos, con aire para el dedo */
    .interruptores { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
    .sw { padding: 4px 0; font-size: 13px; }
    .fila-esqueleto { padding: 20px !important; }
  }

<script type="module">
// El login sale de js/panel-auth.js, que traduce a Supabase. Este archivo
// no se entera: pide las funciones por su nombre y listo.
import { auth, onAuthStateChanged, signOut, esAdmin } from '../js/panel-auth.js';
import { subscribeProductos, precioFinal, formatBs, porcentajeDescuento }
  from '../js/productos-service.js';

const $ = id => document.getElementById(id);
const POR_PAGINA = 50;

let TODOS   = [];       // catálogo completo desde Supabase
let pagina  = 1;
let cargado = false;

// ===========================================================
// GUARD DE SESIÓN
// ===========================================================
onAuthStateChanged(auth, async usuario => {
  if (!usuario) { location.replace('login.html'); return; }
  $('usuarioEmail').textContent = usuario.email;
  $('usuarioEmail').title = usuario.email;
  $('avatar').textContent = (usuario.email || '?').charAt(0);
  $('verificando').remove();
  $('app').hidden = false;
  escucharCatalogo();

  // La vista de entrada se abre recién cuando todos los módulos de abajo
  // ya corrieron: cada uno carga sus datos al recibir 'vista-cambiada', y
  // si el aviso sale antes de que estén escuchando, la vista queda vacía.
  await modulosListos;
  abrirVista(vistaDeLaDireccion() || 'inicio', { reemplazar: true });

  // Con Supabase, estar logueado no alcanza para escribir: hay que estar
  // en la tabla "admins" (ver supabase/02-seguridad.sql). Las políticas RLS
  // ya lo impiden del lado del servidor, así que este chequeo no es la
  // seguridad — es el aviso. Sin él, un usuario fuera de la lista entraría,
  // vería todo, tocaría "Guardar" y recibiría un error de Postgres sin
  // entender por qué.
  if (await esAdmin() === false) {
    aviso('Entraste, pero tu usuario no está en la lista de admins: vas a poder mirar, no guardar.', 'error');
  }
});

// Hay dos botones de salir: el del menú lateral y el de la barra del celular
document.querySelectorAll('.js-salir').forEach(b => b.addEventListener('click', async () => {
  await signOut(auth);
  location.replace('login.html');
}));

$('fechaHoy').textContent = new Date().toLocaleDateString('es-BO',
  { weekday: 'long', day: 'numeric', month: 'long' });

// ===========================================================
// AVISOS
// ===========================================================
function aviso(texto, tipo = '') {
  const el = document.createElement('div');
  el.className = `aviso ${tipo}`;
  el.textContent = texto;
  $('avisos').appendChild(el);
  setTimeout(() => el.remove(), 3600);
}
// Lo usará admin-productos.js en el paso siguiente
window.avisoAdmin = aviso;

// ===========================================================
// IMÁGENES
// ===========================================================
// Los productos guardan rutas como "Img/Netflix.jpg", relativas a la raíz
// del sitio. Como el panel vive en /admin/, hay que subir un nivel.
// Las URLs https:// y los data: quedan tal cual.
function urlImagen(p) {
  const src = (p.imagen || '').trim();
  if (!src) return placeholderSvg(p.nombre);
  if (src.startsWith('http') || src.startsWith('data:') || src.startsWith('../')) return src;
  return '../' + aOptimizada(src);
}

// Las imágenes locales viven en Img/opt: los originales de Img/ se borraron
// por peso. La tienda redirige en imgOptimizada() y acá hace falta lo mismo,
// si no el panel muestra un cuadrito roto en vez del logo.
//
// "Img/Claude.jpg" -> "Img/opt/Claude.jpg" · "Img/iQIYI VIP.png" -> ".../iQIYI VIP.jpg"
// Lo que ya apunta a Img/opt, o no es png/jpg (los .svg), pasa de largo.
function aOptimizada(ruta) {
  if (/^Img\/opt\//i.test(ruta)) return ruta;
  return ruta.replace(/^Img\/(.+)\.(png|jpe?g)$/i, 'Img/opt/$1.jpg');
}

function placeholderSvg(nombre = '?') {
  // [...cadena] corta por caracteres de verdad. Con nombre[0] un emoji
  // quedaba partido al medio (🔥 ocupa dos unidades) y encodeURIComponent
  // tiraba "URI malformed", que rompía el dibujado de TODA la tabla.
  const letra = ([...String(nombre).trim()][0] || '?').toUpperCase();
  return 'data:image/svg+xml,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="10" fill="#eceef1"/>
      <text x="32" y="33" font-family="Arial" font-size="26" font-weight="bold"
            fill="#9aa0ab" text-anchor="middle" dominant-baseline="central">${letra}</text>
    </svg>`);
}

// La tabla muestra un resumen: la descripción entera puede ser muy larga.
function recortarDesc(txt) {
  const limpio = String(txt).replace(/\s+/g, ' ').trim();
  return limpio.length > 90 ? limpio.slice(0, 90) + '…' : limpio;
}

function escapar(s = '') {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

// ===========================================================
// SUSCRIPCIÓN EN TIEMPO REAL
// ===========================================================
function escucharCatalogo() {
  esqueletos();
  subscribeProductos(
    productos => {
      TODOS = productos;
      cargado = true;
      actualizarMetricas();
      llenarFiltroCategorias();
      render();
    },
    error => {
      cargado = true;
      $('cuerpoTabla').innerHTML = `<tr><td colspan="6">
        <div class="estado-vacio">
          <div class="emo">⚠️</div>
          <h3>No se pudo cargar el catálogo</h3>
          <p>${escapar(error.message)}</p>
        </div></td></tr>`;
      aviso('Error al conectar con la base', 'error');
    }
  );
}

function esqueletos() {
  $('cuerpoTabla').innerHTML = Array.from({ length: 8 }, () => `
    <tr class="fila-esqueleto">
      <td><div class="esq" style="width:42px;height:42px;border-radius:8px"></div></td>
      <td><div class="esq" style="width:62%"></div></td>
      <td><div class="esq" style="width:54px"></div></td>
      <td><div class="esq" style="width:74px"></div></td>
      <td><div class="esq" style="width:96px"></div></td>
      <td></td>
    </tr>`).join('');
}

// ===========================================================
// MÉTRICAS
// ===========================================================
function actualizarMetricas() {
  $('mTotal').textContent      = TODOS.length;
  $('mActivos').textContent    = TODOS.filter(p => p.activo !== false).length;
  $('mAgotados').textContent   = TODOS.filter(p => p.activo === false).length;
  $('mOfertas').textContent    = TODOS.filter(p => p.oferta === true).length;
  $('mDestacados').textContent = TODOS.filter(p => p.destacado === true).length;
  $('mPlanes').textContent     = TODOS.filter(p => p.mostrarEnPlanes === true).length;
}

// ===========================================================
// FILTRO DE CATEGORÍAS (se arma solo desde los datos)
// ===========================================================
let categoriasCargadas = '';
function llenarFiltroCategorias() {
  const cats = [...new Set(TODOS.map(p => p.categoria).filter(Boolean))].sort();
  const firma = cats.join('|');
  if (firma === categoriasCargadas) return;   // sin cambios, no re-dibujar
  categoriasCargadas = firma;

  const sel = $('filtroCat');
  const elegida = sel.value;
  sel.innerHTML = '<option value="">Todas las categorías</option>' +
    cats.map(c => {
      const n = TODOS.filter(p => p.categoria === c).length;
      return `<option value="${escapar(c)}">${escapar(c)} (${n})</option>`;
    }).join('');
  sel.value = elegida;
}

// ===========================================================
// FILTRAR + ORDENAR
// ===========================================================
function visibles() {
  const q      = $('buscar').value.trim().toLowerCase();
  const cat    = $('filtroCat').value;
  const estado = $('filtroEstado').value;

  let lista = TODOS.filter(p => {
    if (q && !(p.nombre || '').toLowerCase().includes(q)) return false;
    if (cat && p.categoria !== cat) return false;
    if (estado === 'activo'    && p.activo === false)   return false;
    if (estado === 'agotado'   && p.activo !== false)   return false;
    if (estado === 'oferta'    && p.oferta !== true)    return false;
    if (estado === 'destacado' && p.destacado !== true) return false;
    if (estado === 'planes'    && p.mostrarEnPlanes !== true) return false;
    if (estado === 'sinplanes' && p.mostrarEnPlanes === true) return false;
    return true;
  });

  const orden = $('ordenar').value;
  const copia = [...lista];
  if (orden === 'nombre')      copia.sort((a,b) => (a.nombre||'').localeCompare(b.nombre||''));
  if (orden === 'precio-asc')  copia.sort((a,b) => precioFinal(a) - precioFinal(b));
  if (orden === 'precio-desc') copia.sort((a,b) => precioFinal(b) - precioFinal(a));
  if (orden === 'nuevo')       copia.sort((a,b) => (b.fechaCreacion?.seconds || 0) - (a.fechaCreacion?.seconds || 0));
  return copia;
}

// ===========================================================
// RENDER
// ===========================================================
// Mientras se edita un precio en su celda, la tabla no se redibuja: el
// catálogo llega en vivo y cualquier cambio (hasta el de otro producto)
// borraría lo que estás escribiendo. Se redibuja al guardar o cancelar.
let renderPendiente = false;

function render() {
  if (!cargado) return;
  if ($('cuerpoTabla').querySelector('.precio-edicion')) { renderPendiente = true; return; }
  renderPendiente = false;

  const lista = visibles();
  const total = lista.length;
  const paginas = Math.max(1, Math.ceil(total / POR_PAGINA));
  if (pagina > paginas) pagina = 1;

  const desde = (pagina - 1) * POR_PAGINA;
  const trozo = lista.slice(desde, desde + POR_PAGINA);

  if (total === 0) {
    const buscando = $('buscar').value.trim();
    $('cuerpoTabla').innerHTML = `<tr><td colspan="6">
      <div class="estado-vacio">
        <div class="emo">🔍</div>
        <h3>Sin resultados</h3>
        <p>${buscando
              ? `Ningún producto coincide con «${escapar(buscando)}»`
              : 'Probá cambiando los filtros'}</p>
      </div></td></tr>`;
    $('paginacion').innerHTML = '';
    return;
  }

  $('cuerpoTabla').innerHTML = trozo.map(fila).join('');
  renderPaginacion(paginas, total, desde, trozo.length);
}

function fila(p) {
  const agotado  = p.activo === false;
  const enOferta = p.oferta === true && p.precioOferta > 0;
  const desc     = porcentajeDescuento(p);

  const enPlanes = p.mostrarEnPlanes === true;
  // La descripción se edita desde la tabla, así que la fila la muestra.
  // "pide correo" avisa que a este producto la tienda le va a pedir el
  // correo al cliente en el pago. Es la misma regla que usa index.html
  // en productFlags(): nombre + descripción, todo en minúsculas.
  const textoDesc  = (p.descripcion || '').trim();
  const textoPlano = (textoDesc + ' ' + (p.nombre || '')).toLowerCase();
  const pideCorreo = textoPlano.includes('correo de cliente');


  // Cuatro interruptores en vez de etiquetas y botones con emojis: el
  // estado se ve y se cambia en el mismo lugar, con un toque. Lo que hace
  // cada uno lo resuelve admin-productos.js (accionProducto).
  const sw = (accion, prendido, texto, ayuda) => `
    <button type="button" class="sw" role="switch" aria-checked="${prendido}"
            data-accion="${accion}" data-id="${p.id}" title="${ayuda}">
      <span class="sw-riel"><span class="sw-bola"></span></span>${texto}
    </button>`;

  const interruptores = `
    <div class="interruptores">
      ${sw('agotar',    !agotado,           'Disponible',
           agotado ? 'Apagado: sale como agotado en la tienda' : 'Prendido: se puede comprar')}
      ${sw('oferta',    enOferta,           enOferta && desc ? `Oferta -${desc}%` : 'Oferta',
           enOferta ? 'Apagar la oferta (el precio de oferta queda guardado)' : 'Poner en oferta')}
      ${sw('destacado', p.destacado === true, 'Destacado', 'Destacado en la tienda')}
      ${sw('planes',    enPlanes,           'En Planes', 'Sale en la página Planes y precios')}
    </div>`;

  return `
    <tr class="${agotado ? 'inactivo' : ''}" data-id="${p.id}">
      <td class="celda-img">
        <img class="miniatura" src="${escapar(urlImagen(p))}" alt=""
             loading="lazy" onerror="this.onerror=null;this.src='${placeholderSvg(p.nombre)}'">
      </td>
      <td class="celda-nombre">
        <div class="nombre-txt">${escapar(p.nombre || '(sin nombre)')}</div>
        <div class="nombre-sub">${escapar(p.tipo || '')}</div>
        <button class="desc-btn${textoDesc ? '' : ' vacia'}" data-accion="descripcion" data-id="${p.id}"
                title="Clic para editar la descripción">
          ${textoDesc ? escapar(recortarDesc(textoDesc)) : '+ Agregar descripción'}
          ${pideCorreo ? '<span class="pide-correo">· 📧 pide correo</span>' : ''}
          <span class="desc-lapiz">✏️</span>
        </button>
      </td>
      <td class="celda-precio">
        <button class="precio-btn" data-accion="precio" data-id="${p.id}"
                title="Tocá para cambiar el precio acá mismo">
          ${formatBs(precioFinal(p))}
          ${enOferta ? `<span class="precio-tachado">${formatBs(p.precio)}</span>` : ''}
          <svg class="ico precio-lapiz"><use href="#i-editar"/></svg>
        </button>
      </td>
      <td class="celda-cat"><span class="tag tag-cat">${escapar(p.categoria || '—')}</span></td>
      <td class="celda-estado">${interruptores}</td>
      <td class="celda-acciones">
        <button class="accion-btn" data-accion="editar" data-id="${p.id}" title="Editar todo el producto" aria-label="Editar">
          <svg class="ico"><use href="#i-editar"/></svg><span class="accion-txt">Editar</span>
        </button>
        <button class="accion-btn peligro" data-accion="borrar" data-id="${p.id}" title="Eliminar" aria-label="Eliminar">
          <svg class="ico"><use href="#i-borrar"/></svg><span class="accion-txt">Eliminar</span>
        </button>
      </td>
    </tr>`;
}

function renderPaginacion(paginas, total, desde, enPagina) {
  if (paginas <= 1) {
    $('paginacion').innerHTML =
      `<div class="paginacion"><span class="pag-info">${total} producto${total === 1 ? '' : 's'}</span></div>`;
    return;
  }
  let html = `<div class="paginacion">
    <span class="pag-info">${desde + 1}–${desde + enPagina} de ${total}</span>
    <button class="pag-btn" data-pag="${pagina - 1}" ${pagina === 1 ? 'disabled' : ''}>‹</button>`;

  for (let i = 1; i <= paginas; i++) {
    if (i === 1 || i === paginas || Math.abs(i - pagina) <= 1) {
      html += `<button class="pag-btn ${i === pagina ? 'activo' : ''}" data-pag="${i}">${i}</button>`;
    } else if (Math.abs(i - pagina) === 2) {
      html += `<span style="color:var(--gris-dim)">…</span>`;
    }
  }
  html += `<button class="pag-btn" data-pag="${pagina + 1}" ${pagina === paginas ? 'disabled' : ''}>›</button></div>`;
  $('paginacion').innerHTML = html;
}

// ===========================================================
// EVENTOS
// ===========================================================
let debounce;
$('buscar').addEventListener('input', e => {
  $('cajaBuscador').classList.toggle('con-texto', e.target.value !== '');
  clearTimeout(debounce);
  debounce = setTimeout(() => { pagina = 1; render(); }, 180);
});

$('btnLimpiar').addEventListener('click', () => {
  $('buscar').value = '';
  $('cajaBuscador').classList.remove('con-texto');
  pagina = 1;
  render();
  $('buscar').focus();
});

['filtroCat', 'filtroEstado', 'ordenar'].forEach(id =>
  $(id).addEventListener('change', () => { pagina = 1; render(); }));

$('paginacion').addEventListener('click', e => {
  const btn = e.target.closest('[data-pag]');
  if (!btn || btn.disabled) return;
  pagina = Number(btn.dataset.pag);
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

// Acciones de fila — las implementa admin-productos.js (paso C3)
$('cuerpoTabla').addEventListener('click', e => {
  const btn = e.target.closest('[data-accion]');
  if (!btn) return;
  const { accion, id } = btn.dataset;
  const producto = TODOS.find(p => p.id === id);
  if (!producto) return;

  if (typeof window.accionProducto === 'function') {
    // El botón va también: el interruptor se da vuelta en el acto y el
    // precio se edita en su propia celda.
    window.accionProducto(accion, producto, btn);
  } else {
    aviso('Los botones de editar y borrar se activan en el próximo paso (C3).');
  }
});

$('btnNuevo').addEventListener('click', () => {
  if (typeof window.accionProducto === 'function') {
    window.accionProducto('nuevo', null);
  } else {
    aviso('El formulario de nuevo producto llega en el próximo paso (C3).');
  }
});

// Para que admin-productos.js pueda releer el catálogo ya cargado
window.catalogoAdmin = () => TODOS;
// Y redibujar la tabla al terminar de editar un precio en su celda
window.renderProductos = render;

// ===========================================================
// CAMBIO DE VISTA
// ===========================================================
// Se esconden todas y se muestra la elegida. Agregar una vista nueva es
// agregar su botón en los dos menús, su contenedor y su renglón en
// VISTAS: el resto no se toca.
//
// La vista abierta queda en la dirección (admin/#ventas), así al recargar
// seguís donde estabas y podés guardar un acceso directo a Ventas.
const VISTAS = {
  inicio:    { titulo: 'Inicio',    sub: 'Cómo viene la tienda' },
  productos: { titulo: 'Productos', sub: 'Plataformas, planes y precios de la tienda' },
  juegos:    { titulo: 'Juegos',    sub: 'Juegos de recarga y sus paquetes' },
  ventas:    { titulo: 'Ventas',    sub: 'Pedidos, pagos y entregas' },
  stock:     { titulo: 'Stock',     sub: 'Cuentas cargadas para la entrega automática' }
};

// Los módulos (type="module") corren todos antes de DOMContentLoaded
const modulosListos = new Promise(listo =>
  document.readyState === 'loading'
    ? document.addEventListener('DOMContentLoaded', listo, { once: true })
    : listo());

function vistaDeLaDireccion() {
  const v = location.hash.slice(1);
  return VISTAS[v] ? v : null;
}

function abrirVista(vista, { reemplazar = false } = {}) {
  if (!VISTAS[vista]) return;

  document.querySelectorAll('.vista-tab').forEach(t =>
    t.classList.toggle('activa', t.dataset.vista === vista));

  // productos -> vistaProductos
  const idElegido = 'vista' + vista.charAt(0).toUpperCase() + vista.slice(1);
  document.querySelectorAll('.vista').forEach(v => { v.hidden = v.id !== idElegido; });

  $('tituloVista').textContent    = VISTAS[vista].titulo;
  $('subtituloVista').textContent = VISTAS[vista].sub;
  // Con los pedidos pendientes adelante, si Ventas ya los contó
  const pendientes = window.pendientesAdmin || 0;
  document.title = `${pendientes > 0 ? `(${pendientes}) ` : ''}${VISTAS[vista].titulo} · Panel Tiago Store`;

  if (location.hash !== '#' + vista) {
    history[reemplazar ? 'replaceState' : 'pushState'](null, '', '#' + vista);
  }

  // Para que un módulo pueda refrescar sus datos justo cuando lo abrís,
  // en vez de estar consultando todo el tiempo en segundo plano.
  document.dispatchEvent(new CustomEvent('vista-cambiada', { detail: { vista } }));

  window.scrollTo({ top: 0 });
}
// Para que un módulo pueda mandar a otra vista (Inicio -> "Ver ventas")
window.abrirVistaAdmin = abrirVista;

// Contadores rojos del menú. Los ponen los módulos que ya tienen el dato:
// Ventas (pedidos por atender, en vivo) e Inicio (productos con poco
// stock). En 0 se esconden. El texto va de título, para el mouse, y se
// suma al nombre del botón para los lectores de pantalla.
window.ponerContador = (vista, n, texto = '') => {
  document.querySelectorAll(`.contador[data-contador="${vista}"]`).forEach(c => {
    c.textContent = n > 99 ? '99+' : String(n);
    c.hidden = !(n > 0);
    c.title = n > 0 ? texto : '';
    c.closest('.vista-tab')?.setAttribute('aria-label',
      n > 0 ? `${VISTAS[vista].titulo}: ${texto}` : VISTAS[vista].titulo);
  });
};

document.addEventListener('click', e => {
  const btn = e.target.closest('.vista-tab[data-vista]');
  if (btn) abrirVista(btn.dataset.vista);
});

// Atrás / adelante del navegador
window.addEventListener('popstate', () => {
  const v = vistaDeLaDireccion();
  if (v) abrirVista(v, { reemplazar: true });
});
</script>
