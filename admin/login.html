<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Panel Admin · Tiago Store</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --negro:    #0a0a0a;
    --panel:    #141414;
    --panel-2:  #1c1c1c;
    --borde:    #2a2a2a;
    --rojo:     #e50914;
    --dorado:   #ffd700;
    --texto:    #f5f5f5;
    --gris:     #9a9a9a;
    --gris-dim: #6b6b6b;
    --ok:       #22c55e;
    --error:    #ef4444;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--negro);
    color: var(--texto);
    font-family: 'Outfit', system-ui, -apple-system, sans-serif;
    display: grid;
    place-items: center;
    padding: 24px 18px;
    background-image:
      radial-gradient(900px 420px at 50% -120px, rgba(229,9,20,.13), transparent 65%),
      radial-gradient(600px 300px at 85% 110%, rgba(255,215,0,.05), transparent 60%);
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--borde);
    border-radius: 16px;
    padding: 34px 30px 28px;
    box-shadow: 0 24px 70px rgba(0,0,0,.6);
  }

  /* ---------- Encabezado ---------- */
  .logo {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 34px;
    letter-spacing: .06em;
    text-align: center;
    margin: 0 0 2px;
    line-height: 1;
  }
  .logo .zona { color: var(--rojo); }
  .logo .vip  { color: var(--texto); }

  .subtitulo {
    text-align: center;
    font-size: 11.5px;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: var(--gris-dim);
    margin: 0 0 30px;
  }

  /* ---------- Campos ---------- */
  .campo { margin-bottom: 16px; }

  label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--gris);
    margin-bottom: 7px;
    letter-spacing: .02em;
  }

  .input-wrap { position: relative; }

  input[type=email],
  input[type=password],
  input[type=text] {
    width: 100%;
    padding: 12px 14px;
    background: var(--panel-2);
    border: 1px solid var(--borde);
    border-radius: 9px;
    color: var(--texto);
    font-size: 15px;
    font-family: inherit;
    transition: border-color .15s;
  }
  input::placeholder { color: #555; }
  input:focus {
    outline: none;
    border-color: var(--rojo);
    box-shadow: 0 0 0 3px rgba(229,9,20,.14);
  }
  input:disabled { opacity: .55; }

  #password { padding-right: 46px; }

  .ojo {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--gris-dim);
    cursor: pointer;
    font-size: 16px;
    padding: 8px 10px;
    line-height: 1;
    border-radius: 6px;
  }
  .ojo:hover  { color: var(--texto); }
  .ojo:focus-visible { outline: 2px solid var(--rojo); outline-offset: -2px; }

  /* ---------- Recordar ---------- */
  .fila-recordar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 4px 0 22px;
    flex-wrap: wrap;
  }
  .check {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--gris);
    cursor: pointer;
    user-select: none;
  }
  .check input {
    width: 15px;
    height: 15px;
    accent-color: var(--rojo);
    cursor: pointer;
  }
  .link-btn {
    background: none;
    border: none;
    color: var(--dorado);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    padding: 2px 0;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .link-btn:hover:not(:disabled) { filter: brightness(1.2); }
  .link-btn:disabled { opacity: .45; cursor: not-allowed; }

  /* ---------- Botón ---------- */
  .btn-entrar {
    width: 100%;
    padding: 13px;
    background: var(--rojo);
    color: #fff;
    border: none;
    border-radius: 9px;
    font-size: 15.5px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: .02em;
    transition: filter .15s;
  }
  .btn-entrar:hover:not(:disabled) { filter: brightness(1.15); }
  .btn-entrar:disabled { opacity: .5; cursor: not-allowed; }

  /* ---------- Mensajes ---------- */
  .mensaje {
    margin-top: 18px;
    padding: 12px 14px;
    border-radius: 9px;
    font-size: 13.5px;
    line-height: 1.5;
    display: none;
  }
  .mensaje.visible { display: block; }
  .mensaje.error {
    background: rgba(239,68,68,.09);
    border: 1px solid rgba(239,68,68,.36);
    color: #ffb4b4;
  }
  .mensaje.ok {
    background: rgba(34,197,94,.09);
    border: 1px solid rgba(34,197,94,.36);
    color: #a8ebc0;
  }

  /* ---------- Pie ---------- */
  .pie {
    margin-top: 26px;
    padding-top: 18px;
    border-top: 1px solid var(--borde);
    text-align: center;
  }
  .pie a {
    color: var(--gris-dim);
    font-size: 13px;
    text-decoration: none;
  }
  .pie a:hover { color: var(--texto); }

  /* ---------- Pantalla de carga inicial ---------- */
  #verificando {
    position: fixed;
    inset: 0;
    background: var(--negro);
    display: grid;
    place-items: center;
    z-index: 50;
  }
  .spinner {
    width: 34px; height: 34px;
    border: 3px solid var(--borde);
    border-top-color: var(--rojo);
    border-radius: 50%;
    animation: girar .7s linear infinite;
  }
  @keyframes girar { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 2.5s; }
  }

  .oculto { display: none !important; }
</style>
</head>
<body>

<!-- Tapa la página mientras chequeamos si ya hay sesión abierta -->
<div id="verificando"><div class="spinner" role="status" aria-label="Verificando sesión"></div></div>

<main class="card" id="tarjeta" hidden>
  <h1 class="logo"><span class="zona">TIAGO</span> <span class="vip">STORE</span></h1>
  <p class="subtitulo">Panel de administración</p>

  <form id="formLogin" novalidate>
    <div class="campo">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="username"
             placeholder="tucorreo@gmail.com" autocapitalize="none" spellcheck="false">
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <div class="input-wrap">
        <input type="password" id="password" required autocomplete="current-password"
               placeholder="••••••••">
        <button type="button" class="ojo" id="btnOjo"
                aria-label="Mostrar contraseña">👁</button>
      </div>
    </div>

    <div class="fila-recordar">
      <label class="check">
        <input type="checkbox" id="recordar" checked>
        Mantener sesión iniciada
      </label>
      <button type="button" class="link-btn" id="btnReset">¿Olvidaste tu contraseña?</button>
    </div>

    <button type="submit" class="btn-entrar" id="btnEntrar">Entrar al panel</button>
  </form>

  <div class="mensaje" id="mensaje" role="alert" aria-live="polite"></div>

  <div class="pie">
    <a href="../index.html">← Volver a la tienda</a>
  </div>
</main>

<script type="module">
import { auth } from '../js/firebase-config.js';
import {
  signInWithEmailAndPassword,
  sendPasswordResetEmail,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence,
  browserSessionPersistence
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

const $ = id => document.getElementById(id);
const DESTINO = 'index.html';   // panel al que se entra tras loguearse

// -----------------------------------------------------------
// Mensajes de error en español (en vez de códigos de Firebase)
// -----------------------------------------------------------
const ERRORES = {
  'auth/invalid-credential':  'Email o contraseña incorrectos.',
  'auth/wrong-password':      'Email o contraseña incorrectos.',
  'auth/user-not-found':      'No existe una cuenta con ese email.',
  'auth/invalid-email':       'Ese email no tiene un formato válido.',
  'auth/user-disabled':       'Esta cuenta está deshabilitada.',
  'auth/too-many-requests':   'Demasiados intentos fallidos. Esperá unos minutos y probá de nuevo.',
  'auth/network-request-failed': 'Sin conexión. Revisá tu internet.',
  'auth/missing-password':    'Escribí tu contraseña.',
  // Pasa cuando el sitio corre en un dominio que Firebase no tiene autorizado.
  // Se arregla en: Firebase Console → Authentication → Settings →
  // Dominios autorizados → Agregar dominio.
  'auth/unauthorized-domain':
    'Este dominio no está autorizado en Firebase. Entrá a Authentication → Settings → Dominios autorizados y agregá ' +
    location.hostname + '.'
};

function mostrar(texto, tipo = 'error') {
  const m = $('mensaje');
  m.textContent = texto;
  m.className = `mensaje visible ${tipo}`;
}
function limpiarMensaje() {
  $('mensaje').className = 'mensaje';
}
function bloquear(si) {
  $('btnEntrar').disabled = si;
  $('email').disabled = si;
  $('password').disabled = si;
  $('btnReset').disabled = si;
  $('btnEntrar').textContent = si ? 'Entrando…' : 'Entrar al panel';
}

// -----------------------------------------------------------
// ¿Ya hay sesión abierta? -> derecho al panel
// -----------------------------------------------------------
onAuthStateChanged(auth, usuario => {
  if (usuario) {
    location.replace(DESTINO);
  } else {
    $('verificando').remove();
    $('tarjeta').hidden = false;
    $('email').focus();
  }
});

// -----------------------------------------------------------
// Mostrar / ocultar contraseña
// -----------------------------------------------------------
$('btnOjo').addEventListener('click', () => {
  const campo = $('password');
  const oculta = campo.type === 'password';
  campo.type = oculta ? 'text' : 'password';
  $('btnOjo').textContent = oculta ? '🙈' : '👁';
  $('btnOjo').setAttribute('aria-label', oculta ? 'Ocultar contraseña' : 'Mostrar contraseña');
  campo.focus();
});

// -----------------------------------------------------------
// Entrar
// -----------------------------------------------------------
$('formLogin').addEventListener('submit', async e => {
  e.preventDefault();
  limpiarMensaje();

  const email = $('email').value.trim();
  const pass  = $('password').value;

  if (!email)  { mostrar('Escribí tu email.'); $('email').focus(); return; }
  if (!pass)   { mostrar('Escribí tu contraseña.'); $('password').focus(); return; }

  bloquear(true);
  try {
    // Marcado = la sesión sobrevive al cierre del navegador.
    // Desmarcado = se borra al cerrar la pestaña (útil en compu prestada).
    await setPersistence(auth,
      $('recordar').checked ? browserLocalPersistence : browserSessionPersistence);

    await signInWithEmailAndPassword(auth, email, pass);
    // onAuthStateChanged se encarga de redirigir.
  } catch (err) {
    mostrar(ERRORES[err.code] || `No se pudo entrar: ${err.message}`);
    bloquear(false);
    $('password').select();
  }
});

// -----------------------------------------------------------
// Recuperar contraseña
// -----------------------------------------------------------
$('btnReset').addEventListener('click', async () => {
  limpiarMensaje();
  const email = $('email').value.trim();

  if (!email) {
    mostrar('Escribí tu email arriba y volvé a tocar este botón.');
    $('email').focus();
    return;
  }

  $('btnReset').disabled = true;
  try {
    await sendPasswordResetEmail(auth, email);
    mostrar(`Te mandamos un correo a ${email} con el link para crear una contraseña nueva. Revisá también la carpeta de spam.`, 'ok');
  } catch (err) {
    mostrar(ERRORES[err.code] || `No se pudo enviar el correo: ${err.message}`);
  } finally {
    $('btnReset').disabled = false;
  }
});
</script>
</body>
</html>
