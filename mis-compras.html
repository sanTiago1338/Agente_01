<!--
  ============================================================
  TIAGO STORE · Historial de compras del cliente
  ============================================================
  La lista de lo que compró, guardada SOLO en su navegador.

  No hay login ni cuenta de cliente, a propósito: pedir usuario y
  contraseña antes de dejar comprar espanta ventas. El navegador ya es
  una identidad suficiente — el que compró desde este teléfono es el que
  vuelve a abrirlo.

  Solo entran las compras ENTREGADAS. Un pedido que no se pagó no es una
  compra, es un intento, y llenaría la lista de cosas que nunca compró.

  Se guarda el token, no las credenciales: "Abrir mi cuenta" las vuelve a
  pedir a la base. Así no quedan contraseñas de Netflix escritas en el
  navegador, y si alguna vez cambiás una cuenta entregada, el cliente ve
  la nueva y no una copia vieja.
  ============================================================
-->

<style>
  :root {
    --fondo:        #ffffff;
    --superficie:   #fbfbfc;
    --superficie-2: #f4f5f7;
    --separador:    #ececef;
    --tinta:        #14161a;
    --tinta-media:  #3d424b;
    --tinta-suave:  #767c88;

    font-family: 'Outfit', system-ui, sans-serif;
    background: var(--fondo);

     se acomodan en columnas en vez de quedar en una tira angosta. */

  @media (min-width: 700px) {
    #lista {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 0.8rem;
      margin-bottom: 0.8rem;

  h1 {

    color: var(--tinta);
    margin-bottom: 0.3rem;

  .sub {
    font-size: 0.85rem;
    color: var(--tinta-suave);
    line-height: 1.55;
    margin-bottom: 1.4rem;
  }

  /* ---------- Una compra ---------- */
  .compra {
    background: var(--superficie);
    border: 1px solid var(--separador);
    border-radius: 14px;
    padding: 0.95rem 1.05rem;
    margin-bottom: 0.8rem;
    display: flex;
    align-items: center;
    gap: 0.9rem;
    box-shadow: var(--sombra);
  }

  .compra-datos { flex: 1; min-width: 0; }

  /* "Tengo un problema con mi cuenta": un enlace chico abajo de los datos,
     para que no compita con "Abrir mi cuenta" */
  .btn-problema {
    display: inline-block;
    margin-top: 0.45rem;
    padding: 0;
    background: none;
    border: none;
    color: var(--tinta-suave, #4b515c);
    font: inherit;
    font-size: 0.78rem;
    font-weight: 600;
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
  }
  .btn-problema:hover { color: #15803d; }
  .btn-problema:disabled { opacity: .6; cursor: wait; }

  /* "Comprar de nuevo" y el aviso de vencimiento */
  .compra-links { display: flex; align-items: center; gap: 0.9rem; flex-wrap: wrap; margin-top: 0.5rem; }
  .compra-links .btn-problema { margin-top: 0; }
  .btn-otra {
    padding: 0.4rem 0.85rem;
    border-radius: 999px;
    border: 1px solid rgba(21,128,61,.35);
    background: rgba(34,197,94,.1);
    color: #15803d;
    font: inherit; font-size: 0.8rem; font-weight: 800;
    cursor: pointer;
  }
  .btn-otra:hover { background: rgba(34,197,94,.18); }
  .btn-otra:disabled { opacity: .6; cursor: wait; }
  .compra-vence {
    display: inline-block; margin-top: 0.35rem;
    padding: 0.15rem 0.55rem; border-radius: 999px;
    background: rgba(180,83,9,.1); color: #92400e;
    font-size: 0.75rem; font-weight: 700;
  }

  .compra-num {
    font-weight: 800;
    color: var(--tinta);
    font-size: 0.98rem;
    font-variant-numeric: tabular-nums;

  .compra-prod {

  }
  .compra-fecha {
    font-size: 0.74rem;
    color: var(--tinta-suave);
    margin-top: 0.25rem;
  }
  .compra-faltan {
    display: inline-block;
    margin-top: 0.35rem;
    font-size: 0.72rem;
    font-weight: 700;

  }

  .btn-abrir {
    flex: none;
    background: var(--verde-wa);
    color: #fff;
    border: none;
    border-radius: 9px;
    padding: 0.65rem 0.9rem;
    font-size: 0.82rem;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
  }
  .btn-abrir:hover { filter: brightness(.94); }

  /* ---------- Vacío ---------- */
  .vacio {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--tinta-suave);
  }
  .vacio .emo { font-size: 2.6rem; margin-bottom: 0.7rem; }
  .vacio h2 { font-size: 1.05rem; color: var(--tinta); margin-bottom: 0.4rem; }
  .vacio p { font-size: 0.87rem; line-height: 1.6; }

  .btn-tienda {
    display: inline-block;
    margin-top: 1.3rem;

    color: #fff;
    text-decoration: none;
    padding: 0.8rem 1.5rem;

  }

  /* ---------- Pie ---------- */
  .aviso {
    margin-top: 1.6rem;
    padding: 0.85rem 1rem;
    background: var(--superficie-2);
    border-radius: 10px;
    font-size: 0.78rem;
    color: var(--tinta-suave);
    line-height: 1.6;
  }
  .acciones {
    margin-top: 1.2rem;
    display: flex;
    gap: 0.7rem;

  }
  .link-suave {

    text-underline-offset: 3px;
  }
  .link-suave:hover { color: var(--marca); }

  /* ---------- LIQUID GLASS ----------
     El mismo vidrio que la tienda. Los tonos y el fondo con manchas de
     color están en css/vidrio.css (se carga después). Pisa solo fondos,

    box-shadow: 0 10px 30px rgba(20,22,26,.10), 0 1px 3px rgba(20,22,26,.06),
                0 0 0 .5px rgba(20,22,26,.08),
                inset 0 1px 0 rgba(255,255,255,.95), inset 0 -1px 1px rgba(20,22,26,.04);
  }
  .compra {
    background: var(--vidrio);
    -webkit-backdrop-filter: var(--vidrio-blur);
    backdrop-filter: var(--vidrio-blur);
    border: 1px solid var(--vidrio-borde);
    border-radius: 20px;
    box-shadow: var(--vidrio-sombra), var(--vidrio-brillo);
  }
  .compra-faltan { box-shadow: inset 0 1px 0 rgba(255,255,255,.7); }
  /* Los botones son de vidrio (css/vidrio.css): acá solo la forma */
  .btn-abrir,
  .btn-tienda { border-radius: 999px; }
  .aviso {
    background: var(--vidrio);
    -webkit-backdrop-filter: var(--vidrio-blur);
    backdrop-filter: var(--vidrio-blur);
    border: 1px solid var(--vidrio-borde);
    border-radius: 16px;
    box-shadow: 0 4px 14px rgba(20,22,26,.06), var(--vidrio-brillo);
  }
</style>

<body>

<header>
  <a class="logo" href="index.html">TIAGO STORE</a>
</header>

<main class="caja">
  <h1>Mis compras</h1>
  <p class="sub" id="sub">Cargando…</p>

  <div id="lista"></div>

  <div class="acciones" id="acciones" hidden>
    <a class="link-suave" href="index.html" style="text-decoration:underline;">Seguir comprando</a>
    <button class="link-suave" id="btnVaciar">Borrar esta lista</button>
  </div>

  <div class="aviso" id="aviso" hidden>
    Esta lista se guarda solo en este navegador. Si cambiás de celular o
    borrás los datos de navegación, se pierde — pero tus cuentas siguen
    siendo tuyas: escribinos por WhatsApp y te las reenviamos.
  </div>
</main>

<script type="module">
import { misCompras, olvidarTodo, linkDeCompra } from './js/historial.js';
import { mirarPedido } from './js/pedido-automatico.js';

// El WhatsApp de la tienda, el mismo del botón verde
const WA_TIENDA = '59157707335';

const $ = id => document.getElementById(id);
const escapar = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// "08-09-2026 02:32 PM" — el mismo formato que el cliente tiene en su
// mensaje de WhatsApp y que el dueño ve en el panel. Si acá se escribiera
// distinto, cruzar los tres sería adivinar.
//
// El año va aunque sea el actual, y la hora aunque sea de hoy: si el
// cliente escribe por un problema con una compra, este es el dato que te
// va a pasar para que la encuentres.
function fecha(iso) {
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '';
  const p = n => String(n).padStart(2, '0');
  // Reloj de 12: después de las 12 viene la 1 PM, no las 13.
  const h = d.getHours();
  return `${p(d.getDate())}-${p(d.getMonth() + 1)}-${d.getFullYear()} ` +
         `${p(h % 12 || 12)}:${p(d.getMinutes())} ${h < 12 ? 'AM' : 'PM'}`;
}

// Los nombres repetidos se agrupan: comprar 2 Netflix muestra "2x Netflix"
// y no dos líneas iguales, que parecería un error de la página.
function resumirProductos(productos) {
  const cuenta = new Map();
  for (const p of productos || []) cuenta.set(p, (cuenta.get(p) || 0) + 1);
  return [...cuenta.entries()]
    .map(([nombre, n]) => (n > 1 ? `${n}x ${nombre}` : nombre))
    .join(' · ');
}

function pintar() {
  const compras = misCompras();

  if (compras.length === 0) {
    $('sub').textContent = '';
    $('lista').innerHTML = `
      <div class="vacio">
        <div class="emo"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M8 7h8M8 11h8M8 15h5"/></svg></div>
        <h2>Todavía no hay compras acá</h2>
        <p>Cuando compres una cuenta y te la entreguemos,<br>
           te va a quedar guardada en esta lista.</p>
        <a class="btn-tienda" href="index.html">Ir a la tienda</a>
      </div>`;
    $('acciones').hidden = true;
    $('aviso').hidden = true;
    return;
  }

  $('sub').textContent = compras.length === 1
    ? 'Tu compra, guardada en este navegador.'
    : `Tus ${compras.length} compras, guardadas en este navegador.`;

  $('lista').innerHTML = compras.map(c => `
    <div class="compra">
      <div class="compra-datos">
        <div class="compra-num">Pedido #${c.numero}</div>
        <div class="compra-prod">${escapar(resumirProductos(c.productos))}</div>
        <div class="compra-fecha">Fecha de orden: ${fecha(c.fecha)}</div>
        ${c.faltan > 0
          ? `<span class="compra-faltan">Falta ${c.faltan === 1 ? '1 cuenta' : c.faltan + ' cuentas'}</span>`
          : ''}
        ${avisoDeVencimiento(c.vence)}
        <div class="compra-links">
          <button type="button" class="btn-otra" data-recomprar="${escapar(c.token)}">Comprar de nuevo</button>
          <button type="button" class="btn-problema" data-problema="${escapar(c.token)}">Tengo un problema con mi cuenta</button>
        </div>
      </div>
      <a class="btn-abrir" href="${linkDeCompra(c.token)}">Abrir mi cuenta</a>
    </div>`).join('');

  $('acciones').hidden = false;
  $('aviso').hidden = false;
}

// ------------------------------------------------------------
// "Tengo un problema con mi cuenta"
// ------------------------------------------------------------
// Abre el WhatsApp de la tienda con el pedido, la fecha, el producto y el
// usuario de cada cuenta ya escritos: así no hay que preguntarle "¿cuál
// era tu pedido?" y se resuelve más rápido. La clave NO va: no hace falta
// para encontrar la cuenta y no tiene por qué andar en un chat.
//
// El usuario no está guardado acá (solo el token), así que se consulta al
// tocar. La ventana se abre ANTES de consultar: si se abriera después, el
// navegador la tomaría por una ventana emergente y la bloquearía.
async function escribirPorProblema(token, boton) {
  const c = misCompras().find(x => x.token === token);
  if (!c) return;

  const ventana = window.open('', '_blank');
  boton.disabled = true;
  const compra = await mirarPedido(token);
  boton.disabled = false;

  // Una línea por cuenta entregada, con su usuario si se pudo consultar
  const lineas = compra
    ? (compra.lineas || []).filter(l => l.estado === 'entregado').map(l => {
        const usuario = l.credenciales && (l.credenciales.usuario || l.credenciales.email);
        return `${l.producto}${usuario ? ` · usuario: ${usuario}` : ''}`;
      })
    : (c.productos || []);

  const texto = [
    'Hola, tengo un problema con mi cuenta de Tiago Store.',
    `Pedido #${c.numero} · ${fecha(c.fecha)}`,
    ...lineas,
    '¿Me ayudan?'
  ].join('\n');
  const url = `https://wa.me/${WA_TIENDA}?text=${encodeURIComponent(texto)}`;

  if (ventana) ventana.location.href = url;
  else location.href = url;          // sin ventanas nuevas: en la misma
}

// ------------------------------------------------------------
// "Comprar de nuevo"
// ------------------------------------------------------------
// Lleva a la tienda con los mismos productos ya en el carrito
// (index.html#comprar=<id>,<id>: la tienda lo arma al cargar). Las compras
// guardadas desde ahora traen los ids; las de antes se consultan al tocar.
async function comprarDeNuevo(token, boton) {
  const c = misCompras().find(x => x.token === token);
  if (!c) return;

  let fids = c.fids && c.fids.length ? c.fids : null;
  if (!fids) {
    boton.disabled = true;
    const compra = await mirarPedido(token);
    boton.disabled = false;
    fids = compra
      ? (compra.lineas || []).filter(l => l.estado === 'entregado' && l.producto_id).map(l => l.producto_id)
      : [];
  }
  if (!fids.length) {
    alert('No pudimos encontrar esos productos. Buscalos en la tienda o escribinos por WhatsApp.');
    return;
  }
  location.href = `index.html#comprar=${fids.join(',')}`;
}

// "Se te vence el 25/10" si falta una semana o menos (o ya se venció)
function avisoDeVencimiento(vence) {
  if (!vence) return '';
  const m = String(vence).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return '';
  const dia = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const faltan = Math.round((dia - hoy) / 864e5);
  if (faltan > 7) return '';
  const fechaTxt = `${m[3]}/${m[2]}`;
  return `<span class="compra-vence">${faltan < 0 ? `Se te venció el ${fechaTxt}` : faltan === 0 ? 'Se te vence hoy' : `Se te vence el ${fechaTxt}`}</span>`;
}

$('lista').addEventListener('click', e => {
  const problema = e.target.closest('[data-problema]');
  if (problema) { escribirPorProblema(problema.dataset.problema, problema); return; }
  const otra = e.target.closest('[data-recomprar]');
  if (otra) comprarDeNuevo(otra.dataset.recomprar, otra);
});

$('btnVaciar').addEventListener('click', () => {
  // Se pregunta porque no se puede deshacer desde acá. Las compras siguen
  // existiendo del lado de la tienda; lo que se borra es este recuerdo.
  if (!confirm('¿Borrar la lista de compras de este navegador?\n\nTus cuentas siguen siendo tuyas: si las necesitás, escribinos por WhatsApp.')) return;
  olvidarTodo();
  pintar();
});

pintar();
</script>

<script src="bg-burbujas.js?v=20261004153813" defer></script>
